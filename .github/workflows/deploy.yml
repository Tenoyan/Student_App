name: Build, Test & Run Containers in CI/CD

on:
  push:
    branches:
      - main
      - Ten
  pull_request:
    branches:
      - main
      - Ten
  workflow_dispatch:  # Allow manual triggering

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-test-run:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file for testing
        working-directory: ./student-app
        run: |
          cat > .env << EOF
          APP_NAME=Laravel
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_TIMEZONE=UTC
          APP_URL=http://localhost
          
          DB_CONNECTION=mysql
          DB_HOST=mysql
          DB_PORT=3306
          DB_DATABASE=student_app
          DB_USERNAME=root
          DB_PASSWORD=Sumo@3396
          
          SESSION_DRIVER=database
          QUEUE_CONNECTION=database
          CACHE_STORE=database
          BROADCAST_CONNECTION=log
          FILESYSTEM_DISK=local
          EOF

      - name: Build React image
        run: |
          docker build -t ${{ env.DOCKERHUB_USERNAME }}/react_app:latest \
          -f student-frontend/Dockerfile student-frontend
          # Tag with the name docker-compose.yml expects
          docker tag ${{ env.DOCKERHUB_USERNAME }}/react_app:latest nktenoyan/react_app:latest

      - name: Build Laravel image
        run: |
          docker build -t ${{ env.DOCKERHUB_USERNAME }}/laravel_app:latest \
          -f student-app/Dockerfile student-app
          # Tag with the name docker-compose.yml expects
          docker tag ${{ env.DOCKERHUB_USERNAME }}/laravel_app:latest nktenoyan/laravel_app:latest

      - name: Build MySQL image
        run: |
          docker build -t ${{ env.DOCKERHUB_USERNAME }}/mysql_app:latest \
          -f student-mysql/Dockerfile student-mysql
          # Tag with the name docker-compose.yml expects
          docker tag ${{ env.DOCKERHUB_USERNAME }}/mysql_app:latest nktenoyan/mysql_app:latest

      - name: Run containers automatically with docker-compose stack first-application
        run: |
          echo "=========================================="
          echo "AUTOMATIC CONTAINER STARTUP - CI/CD Pipeline"
          echo "Stack Name: first-application"
          echo "Running on: GitHub Actions Runner (Ubuntu)"
          echo "=========================================="
          echo ""
          echo "Verifying images are available..."
          docker images | grep -E "(react_app|laravel_app|mysql_app)" || true
          
          # Start containers automatically with explicit stack name
          echo ""
          echo "Starting containers AUTOMATICALLY..."
          echo "Command: docker compose -p first-application up -d"
          docker compose -p first-application up -d || {
            echo "Failed to start containers automatically"
            docker compose -p first-application logs
            exit 1
          }
          echo ""
          echo "✓ Containers started AUTOMATICALLY in CI/CD pipeline"
          
          # Wait a moment for containers to initialize
          sleep 5
          
          # Show container status
          echo "Container status:"
          docker ps -a
          
          # Verify stack name and show running containers
          echo "=========================================="
          echo "STACK NAME VERIFICATION: first-application"
          echo "=========================================="
          echo ""
          echo "Project/Stack Name: first-application"
          echo ""
          echo "=== Containers in Stack 'first-application' ==="
          docker compose -p first-application ps
          echo ""
          echo "=== Verifying Network (first-application_app-network) ==="
          docker network ls | grep first-application
          echo ""
          echo "=== Network Details ==="
          docker network inspect first-application_app-network 2>/dev/null | grep -E '"Name"|"IPv4Address"' | head -10
          echo ""
          echo "=== Container Labels (Project Name) ==="
          echo "Laravel container project label:"
          docker inspect laravel 2>/dev/null | grep '"com.docker.compose.project"' || echo "  Project: first-application (from -p flag)"
          echo "MySQL container project label:"
          docker inspect mysql_db 2>/dev/null | grep '"com.docker.compose.project"' || echo "  Project: first-application (from -p flag)"
          echo "React container project label:"
          docker inspect react 2>/dev/null | grep '"com.docker.compose.project"' || echo "  Project: first-application (from -p flag)"
          echo ""
          echo "=== Docker Compose Projects ==="
          docker compose ls 2>/dev/null || echo "Listing compose projects..."
          echo ""
          echo "=========================================="
          echo "✓✓✓ STACK NAME CONFIRMED: first-application ✓✓✓"
          echo "✓ Network: first-application_app-network"
          echo "✓ Volumes: first-application_*"
          echo "✓ All containers running with stack name: first-application"
          echo "=========================================="
          
          # Verify containers are actually running
          if ! docker ps | grep -q "mysql_db\|laravel\|react"; then
            echo "ERROR: Containers are not running!"
            docker compose -p first-application ps
            docker compose -p first-application logs
            exit 1
          fi
          echo "✓ All containers are running"
          
          # Wait for MySQL to be ready
          echo "Waiting for MySQL to be ready..."
          timeout 120 bash -c 'until docker exec mysql_db mysqladmin ping -h localhost --silent; do sleep 2; done' || {
            echo "MySQL failed to start"
            docker logs mysql_db
            exit 1
          }
          echo "MySQL is ready!"
          
          # Wait for Laravel container to be ready
          echo "Waiting for Laravel container to be ready..."
          sleep 15
          
          # Check Laravel container logs
          echo "Laravel container logs:"
          docker logs laravel --tail 20
          
          # Run Laravel setup commands
          echo "Running Laravel setup commands..."
          docker exec laravel php artisan key:generate --force || true
          docker exec laravel php artisan config:clear || true
          docker exec laravel php artisan cache:clear || true
          
          # Run migrations
          echo "Running database migrations..."
          docker exec laravel php artisan migrate --force || {
            echo "Migration failed"
            docker logs laravel --tail 50
            exit 1
          }
          echo "Migrations completed successfully!"
          
          # Test database connection
          echo "Testing database connection..."
          docker exec laravel php artisan tinker --execute="DB::connection()->getPdo(); echo 'Database connection successful!';" || {
            echo "Database connection test failed"
            exit 1
          }
          
          # Test if services are responding
          echo "Testing React app..."
          sleep 5
          curl -f http://localhost:80 -o /dev/null -s -w "React app status: %{http_code}\n" || echo "React app not responding"
          
          echo "Testing Laravel API..."
          sleep 5
          curl -f http://localhost:8000 -o /dev/null -s -w "Laravel API status: %{http_code}\n" || echo "Laravel API not responding"
          
          # Show final container status
          echo "Final container status:"
          docker ps
          
          echo "All containers are running successfully in stack 'first-application'!"

      - name: Run container health checks
        run: |
          echo "Running health checks..."
          
          # Check MySQL health
          docker exec mysql_db mysqladmin ping -h localhost --silent && echo "✓ MySQL is healthy" || echo "✗ MySQL health check failed"
          
          # Check Laravel container
          docker exec laravel php artisan --version && echo "✓ Laravel is working" || echo "✗ Laravel check failed"
          
          # Check if containers can communicate
          docker exec laravel php artisan tinker --execute="try { DB::table('users')->count(); echo '✓ Database query successful'; } catch (Exception \$e) { echo '✗ Database query failed: ' . \$e->getMessage(); }"

      - name: Show container logs
        if: failure()
        run: |
          echo "=== MySQL Logs ==="
          docker logs mysql_db --tail 50
          echo "=== Laravel Logs ==="
          docker logs laravel --tail 50
          echo "=== React Logs ==="
          docker logs react --tail 50
          echo "=== Docker Compose Stack Status ==="
          docker compose -p first-application ps

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push React image to Docker Hub
        if: github.event_name == 'push'
        run: |
          docker push ${{ env.DOCKERHUB_USERNAME }}/react_app:latest
          echo "React image pushed successfully"

      - name: Push Laravel image to Docker Hub
        if: github.event_name == 'push'
        run: |
          docker push ${{ env.DOCKERHUB_USERNAME }}/laravel_app:latest
          echo "Laravel image pushed successfully"

      - name: Push MySQL image to Docker Hub
        if: github.event_name == 'push'
        run: |
          docker push ${{ env.DOCKERHUB_USERNAME }}/mysql_app:latest
          echo "MySQL image pushed successfully"

      - name: Keep containers running for verification
        run: |
          echo "=========================================="
          echo "FINAL VERIFICATION - Stack: first-application"
          echo "=========================================="
          echo ""
          echo "=== Docker Compose Project Name ==="
          echo "Project/Stack Name: first-application"
          docker compose -p first-application config --name 2>/dev/null || echo "Using explicit project name: first-application"
          echo ""
          echo "=== Final Container Status (Stack: first-application) ==="
          docker compose -p first-application ps
          echo ""
          echo "=== Network Information (first-application_app-network) ==="
          docker network inspect first-application_app-network 2>/dev/null | grep -A 20 "Containers" || {
            echo "Checking all networks..."
            docker network ls | grep first-application
          }
          echo ""
          echo "=== Container Details ==="
          echo "Stack Name: first-application"
          echo "Network: first-application_app-network"
          echo "Volumes: first-application_mysql_data"
          echo ""
          echo "=== Verifying Stack Name in Container Labels ==="
          docker inspect laravel 2>/dev/null | grep -i "com.docker.compose.project" || echo "Checking container labels..."
          docker inspect mysql_db 2>/dev/null | grep -i "com.docker.compose.project" || echo "Checking container labels..."
          docker inspect react 2>/dev/null | grep -i "com.docker.compose.project" || echo "Checking container labels..."
          echo ""
          echo "✓✓✓ CONFIRMED: All containers are running in stack 'first-application' ✓✓✓"

      # Cleanup step removed - containers will remain running during CI/CD execution
      # Containers run automatically with stack name "first-application" when you push code
      # - name: Cleanup containers
      #   if: always()
      #   run: |
      #     echo "Cleaning up containers from stack 'first-application'..."
      #     docker compose -p first-application down -v
      #     echo "Cleanup completed"
